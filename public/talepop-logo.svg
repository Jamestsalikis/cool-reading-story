<svg viewBox="0 0 1400 540" xmlns="http://www.w3.org/2000/svg">
  <defs>

    <!-- Rich drop shadow for wordmark -->
    <filter id="text-shadow" x="-5%" y="-20%" width="115%" height="160%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="11" result="blur"/>
      <feOffset in="blur" dx="0" dy="9" result="shifted"/>
      <feFlood flood-color="#080e22" flood-opacity="0.24" result="colour"/>
      <feComposite in="colour" in2="shifted" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Pill shadow -->
    <filter id="pill-shadow" x="-5%" y="-10%" width="115%" height="170%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="14" result="blur"/>
      <feOffset in="blur" dx="0" dy="10" result="shifted"/>
      <feFlood flood-color="#080e22" flood-opacity="0.20" result="colour"/>
      <feComposite in="colour" in2="shifted" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>

    <!-- Star glow -->
    <filter id="star-glow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="3" stdDeviation="6" flood-color="#cc8800" flood-opacity="0.35"/>
    </filter>

  </defs>

  <!-- ── Pink 5-pt star, top left ── -->
  <polygon points="255,40 259.70,53.53 274.02,53.82 262.61,62.47 266.76,76.18 255,68 243.24,76.18 247.39,62.47 235.98,53.82 250.30,53.53" fill="#FF7DAE"/>

  <!-- ── Gold 5-pt star, above the P in Pop ── -->
  <polygon points="842,94 850.82,119.86 878.14,120.26 856.27,136.64 864.34,162.76 842,147 819.66,162.76 827.73,136.64 805.86,120.26 833.18,119.86" fill="#FFB703" filter="url(#star-glow)"/>

  <!-- ── Teal 4-point sparkle, top right ── -->
  <path d="M1148,48 L1153,65 L1170,70 L1153,75 L1148,92 L1143,75 L1126,70 L1143,65 Z" fill="#1496A6" opacity="0.9"/>

  <!-- ── Scattered colour dots ── -->
  <circle cx="58"   cy="285" r="10" fill="#8E7BFF"/>
  <circle cx="1342" cy="270" r="8"  fill="#FFB703"/>
  <circle cx="85"   cy="445" r="7"  fill="#6CC06C"/>
  <circle cx="1315" cy="445" r="7"  fill="#FF7DAE"/>
  <circle cx="42"   cy="165" r="5"  fill="#FF6B35" opacity="0.55"/>
  <circle cx="1358" cy="178" r="5"  fill="#8E7BFF" opacity="0.55"/>

  <!-- ── MAIN WORDMARK ── x=228 centres TalePop (944px wide) at x=700 -->
  <text
    x="228" y="315"
    text-anchor="start"
    font-family="Fredoka One, Arial Rounded MT Bold, Verdana, sans-serif"
    font-size="220"
    font-weight="900"
    filter="url(#text-shadow)"
  ><tspan fill="#0D183D">Tale</tspan><tspan fill="#FF6B35">Pop</tspan></text>

  <!-- ── SUBTITLE ── -->
  <text
    x="700" y="382"
    text-anchor="middle"
    font-family="Fredoka One, Arial Rounded MT Bold, Verdana, sans-serif"
    font-size="32"
    font-weight="700"
    fill="#1496A6"
    letter-spacing="5"
  >— Your story maker —</text>

  <!-- ── TAGLINE PILL ── -->
  <rect x="348" y="406" width="704" height="70" rx="35" fill="#1496A6" filter="url(#pill-shadow)"/>
  <text
    x="700" y="452"
    text-anchor="middle"
    font-family="Fredoka One, Arial Rounded MT Bold, Verdana, sans-serif"
    font-size="26"
    font-weight="700"
    fill="white"
    letter-spacing="1"
  >Imagine away, a new tale every day.</text>

</svg>
